media:
  - name: blog_images
    label: Blog images
    input: public/images/blog
    output: /images/blog
    rename: safe
    extensions: [jpg, jpeg, png, webp, avif]
    categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "content: create {name}"
      update: "content: update {name}"
      delete: "content: delete {name}"
      rename: "content: rename {oldFilename} to {newFilename}"

content:
  - name: categories
    label: Blog categories
    type: collection
    path: src/content/categories
    format: yaml
    filename: "{slug}.yaml"
    view:
      primary: title
      fields: [title, slug]
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Category title
        type: string
        required: true
        options:
          minlength: 2
          maxlength: 60
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase words separated by hyphens.
      - name: description
        label: Short description
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 240

  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{slug}.md"
    view:
      primary: title
      fields: [title, published, category, publishedAt]
      search: [title, excerpt, category]
      sort: [publishedAt, title]
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        options:
          minlength: 5
          maxlength: 100
      - name: slug
        label: URL slug
        type: string
        required: true
        description: Use lowercase words separated by hyphens. Changing this changes the article URL.
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Use lowercase words separated by hyphens.
      - name: excerpt
        label: Excerpt
        type: text
        required: true
        description: Plain-language summary used on article cards and in the RSS feed.
        options:
          minlength: 30
          maxlength: 240
      - name: published
        label: Published
        type: boolean
        required: true
        description: Turn this on only when the article is approved and ready to appear publicly.
      - name: contentType
        label: Content type
        type: select
        required: true
        options:
          values:
            - name: education
              label: Patient education
            - name: practiceUpdate
              label: Practice update
      - name: category
        label: Category
        type: reference
        required: true
        options:
          collection: categories
          value: "{fields.slug}"
          label: "{fields.title}"
          search: "title,slug"
      - name: authorType
        label: Author type
        type: select
        required: true
        options:
          values:
            - name: pa
              label: Physician Associate
            - name: guest
              label: Guest author
      - name: guestName
        label: Guest name
        type: string
        description: Required when Author type is Guest author.
      - name: guestCredentials
        label: Guest credentials
        type: string
      - name: guestOrganization
        label: Guest organization
        type: string
      - name: publishedAt
        label: Publication date
        type: date
        required: true
      - name: updatedAt
        label: Updated date
        type: date
      - name: reviewedAt
        label: Reviewed date
        type: date
      - name: featured
        label: Featured article
        type: boolean
        required: true
        description: If several articles are featured, the newest one is used.
      - name: coverImage
        label: Cover image
        type: image
        options:
          media: blog_images
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
      - name: coverImageAlt
        label: Cover image alternative text
        type: string
        description: Required whenever a cover image is selected. Describe the image for people who cannot see it.
        options:
          maxlength: 180
      - name: coverImageCaption
        label: Cover image caption
        type: string
      - name: seoTitle
        label: SEO title
        type: string
        description: Optional. The article title is used when blank.
        options:
          maxlength: 60
      - name: seoDescription
        label: SEO description
        type: text
        description: Optional. The excerpt is used when blank.
        options:
          maxlength: 160
      - name: sample
        label: Sample article
        type: boolean
        required: true
        description: Turn this off after replacing the starter text with approved content.
      - name: body
        label: Article body
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: blog_images
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
